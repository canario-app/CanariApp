# CanariApp — entorno completo (BD + API + Frontend)
# Uso:  copiar .env.example a .env, cambiar las claves y ejecutar:
#       docker compose up -d --build
# Web:  http://localhost:8080     API: http://localhost:8081/api/health
name: canariapp

services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: canariapp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@canariapp.cl}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD en .env}
      SEED_MUTACIONES_PROPUESTA: ${SEED_MUTACIONES_PROPUESTA:-0}
      TZ: America/Santiago
      PGTZ: America/Santiago
      LANG: C.UTF-8
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=es-CL --encoding=UTF8
    volumes:
      - canariapp_pg:/var/lib/postgresql/data
      - ./BaseDatos:/opt/canariapp/sql:ro
      - ./docker/db/01-canariapp.sh:/docker-entrypoint-initdb.d/01-canariapp.sh:ro
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"   # para pgAdmin (solo este PC)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d canariapp_db"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
      target: api
    environment:
      APP_NAME: CanariApp
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: http://localhost:${API_PORT:-8081}
      APP_TIMEZONE: America/Santiago
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: canariapp_db
      DB_USER: canariapp
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      JWT_EXPIRATION: "1800"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
      target: web
    environment:
      API_URL: http://api        # el front llama a la API por la red interna de Docker
      TZ: America/Santiago
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  canariapp_pg:
